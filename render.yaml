services:
  - type: web
    name: moontvplus
    runtime: image
    plan: free
    image:
      url: ghcr.io/ningkingstar/moontvplus:latest
    envVars:
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: MoonTVPlus
      - key: CRON_PASSWORD
        # 不再写死默认口令：让 Render 生成一个随机值。
        # 想自己指定就改成 sync: false，部署时在控制台填写。
        generateValue: true
